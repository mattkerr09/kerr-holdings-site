# GitHub Pages builds this site with Jekyll defaults. These are working files, not pages:
# the README and the build scripts were being served publicly (found 2026-09-25).
exclude:
  - README.md
  - scripts
  - data
# 11 Nov: data/ holds the dated source copies behind /legal/ (evidence, not pages); .well-known/security.txt must be served.
include:
  - .well-known
