<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kerr &amp; Company LLC">
  <!-- The entity page's own palette: --paper #f2efe9 and --mark #3a4a3f. Not a
       logo — a serif K set as a record, matching a page that is deliberately a
       document rather than a landing page. One tone, no gradient, because at
       16px anything else becomes mud. -->
  <rect width="64" height="64" rx="10" fill="#f2efe9"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="Iowan Old Style, Charter, Georgia, Cambria, ui-serif, serif"
        font-size="42" font-weight="600" fill="#3a4a3f">K</text>
</svg>
