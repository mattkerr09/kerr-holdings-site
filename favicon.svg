<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Kerr &amp; Company">
  <!-- The Kerr & Co. sunflower, the same twelve-petal small mark builtbykerr.com
       uses, so the two Kerr sites carry one family mark. Amber on ink rather
       than builtbykerr's black on white, so the two tabs are still told apart.
       Petals are FILLED, not outlined: at 16px an outline is sub-pixel and the
       mark turns to mud. #F0B545 is the site's "mark" token (dark theme) and
       #17130C its "ink" token, which is what ops/bin/favicon-gate.py compares.
       (No double hyphen anywhere in this comment: XML forbids it, and one
       invalid comment makes the whole icon fail to load.) -->
  <rect width="100" height="100" rx="22" fill="#17130C"/>
  <g transform="translate(50 50) scale(.88) translate(-50 -50)">
    <g fill="#F0B545" stroke="#F0B545" stroke-width="2.6" stroke-linejoin="round">
      <path d="M45.81 29.42C44.15 13.08 50 8 50 8C50 8 55.85 13.08 54.19 29.42Z"/>
      <path d="M56.66 30.09C63.4 15.1 71 13.63 71 13.63C71 13.63 73.52 20.95 63.92 34.27Z"/>
      <path d="M65.73 36.08C79.05 26.48 86.37 29 86.37 29C86.37 29 84.9 36.6 69.91 43.34Z"/>
      <path d="M70.58 45.81C86.92 44.15 92 50 92 50C92 50 86.92 55.85 70.58 54.19Z"/>
      <path d="M69.91 56.66C84.9 63.4 86.37 71 86.37 71C86.37 71 79.05 73.52 65.73 63.92Z"/>
      <path d="M63.92 65.73C73.52 79.05 71 86.37 71 86.37C71 86.37 63.4 84.9 56.66 69.91Z"/>
      <path d="M54.19 70.58C55.85 86.92 50 92 50 92C50 92 44.15 86.92 45.81 70.58Z"/>
      <path d="M43.34 69.91C36.6 84.9 29 86.37 29 86.37C29 86.37 26.48 79.05 36.08 65.73Z"/>
      <path d="M34.27 63.92C20.95 73.52 13.63 71 13.63 71C13.63 71 15.1 63.4 30.09 56.66Z"/>
      <path d="M29.42 54.19C13.08 55.85 8 50 8 50C8 50 13.08 44.15 29.42 45.81Z"/>
      <path d="M30.09 43.34C15.1 36.6 13.63 29 13.63 29C13.63 29 20.95 26.48 34.27 36.08Z"/>
      <path d="M36.08 34.27C26.48 20.95 29 13.63 29 13.63C29 13.63 36.6 15.1 43.34 30.09Z"/>
    </g>
    <circle cx="50" cy="50" r="20" fill="#17130C" stroke="#F0B545" stroke-width="5"/>
    <g fill="#F0B545">
      <circle cx="45.35" cy="54.26" r="3.4"/><circle cx="50.78" cy="41.11" r="3.4"/>
